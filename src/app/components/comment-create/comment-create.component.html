<div class="comment-create-container">
    <div class="header-with-back">
      <button type="button" class="btn-back" (click)="cancel()">
        <i class="material-icons">arrow_back</i> Volver
      </button>
      <h2>Crear nuevo comentario</h2>
    </div>
  
    <form [formGroup]="commentForm" (ngSubmit)="onSubmit()">
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  
      <div class="form-group">
        <label for="content">Comentario*</label>
        <textarea id="content" formControlName="content" class="form-control" 
                  [class.is-invalid]="hasError('content', 'required') || hasError('content', 'minlength')"></textarea>
        <div *ngIf="hasError('content', 'required')" class="invalid-feedback">
          El comentario es obligatorio.
        </div>
        <div *ngIf="hasError('content', 'minlength')" class="invalid-feedback">
          El comentario debe tener al menos 1 carácter.
        </div>
      </div>
  
      <div class="form-group">
        <label for="activityId">ID de la actividad*</label>
        <input type="text" id="activityId" formControlName="activityId" class="form-control"
               [class.is-invalid]="hasError('activityId', 'required')">
        <div *ngIf="hasError('activityId', 'required')" class="invalid-feedback">
          El ID de la actividad es obligatorio.
        </div>
      </div>
  
      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancel()">
          Cancelar
        </button>
        <button type="submit" class="btn-save" [disabled]="commentForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
          Crear comentario
        </button>
      </div>
    </form>
  </div>
